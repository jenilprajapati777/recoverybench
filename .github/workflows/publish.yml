name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate Distribution Packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build and Distribution Validation Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine

      - name: Build Wheel and Source Distribution
        run: python -m build

      - name: Validate Package Metadata with Twine Check
        run: twine check --strict dist/*

      - name: Execute Distribution Smoke Test in Isolated Environment
        run: python scripts/distribution_smoke_test.py

      - name: Upload Built Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 1

  publish-to-pypi:
    name: Publish to PyPI via Trusted Publishing (OIDC)
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/recoverybench
    permissions:
      id-token: write  # MANDATORY for PyPI Trusted Publishing OIDC token exchange

    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
