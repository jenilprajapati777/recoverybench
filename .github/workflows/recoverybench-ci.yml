name: RecoveryBench CI

on:
  push:
    branches:
      - main
      - master
      - fix/p0-audit-remediation
      - phase-2/cli-distribution
  pull_request:
    branches:
      - main
      - master
      - fix/p0-audit-remediation
      - phase-2/cli-distribution
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent adapter to evaluate"
        required: true
        default: "idempotent"
        type: choice
        options:
          - idempotent
          - langgraph-idempotent
          - naive
          - langgraph-naive
      isolation:
        description: "Execution isolation mode: 'isolated' (Docker container) or 'trusted' (in-process)"
        required: true
        default: "isolated"
        type: choice
        options:
          - isolated
          - trusted

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-test:
    name: Recovery Evaluation (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-22.04", "ubuntu-24.04"]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install RecoveryBench & Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[langgraph,dev]"

      - name: Pull Pinned Docker Sandbox Runtime Image
        run: |
          docker pull python:3.11-slim@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535

      - name: Environment Health Check (Doctor with Required Isolation)
        run: recoverybench doctor --require-isolation

      - name: Validate Scenario Definitions
        run: recoverybench validate scenarios

      - name: Execute RecoveryBench Scenario Suite
        id: scenario_suite
        run: |
          AGENT="${{ github.event.inputs.agent || 'idempotent' }}"
          ISOLATION="${{ github.event.inputs.isolation || 'isolated' }}"
          echo "Running RecoveryBench suite against agent: $AGENT (isolation: $ISOLATION)"
          recoverybench suite scenarios \
            --agent "$AGENT" \
            --isolation "$ISOLATION" \
            --output-dir "reports" \
            --junit

      - name: Publish JUnit Test Results
        uses: mikepenz/action-junit-report@v4
        if: always() && (steps.scenario_suite.conclusion == 'success' || steps.scenario_suite.conclusion == 'failure')
        with:
          report_paths: "reports/*_report.xml"
          check_name: "RecoveryBench Invariant Results (${{ matrix.os }}, py${{ matrix.python-version }})"
          fail_on_failure: true
          require_tests: true

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        if: always() && (steps.scenario_suite.conclusion == 'success' || steps.scenario_suite.conclusion == 'failure')
        with:
          name: recoverybench-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/
          retention-days: 30

      - name: Run Lint and Static Type Verification
        if: matrix.python-version == '3.11'
        run: |
          ruff check .
          mypy src tests

      - name: Verify Package Artifacts & Metadata (PEP 639)
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install --upgrade build
          python -m build
          python -c "
          import zipfile, tarfile, pathlib, sys

          dist_dir = pathlib.Path('dist')
          wheels = list(dist_dir.glob('*.whl'))
          sdists = list(dist_dir.glob('*.tar.gz'))

          if not wheels:
              sys.exit('Packaging verification failed: No wheel (.whl) artifact found in dist/')
          if not sdists:
              sys.exit('Packaging verification failed: No sdist (.tar.gz) artifact found in dist/')

          wheel_path = wheels[0]
          sdist_path = sdists[0]

          print(f'Inspecting wheel: {wheel_path.name}')
          with zipfile.ZipFile(wheel_path) as zf:
              names = zf.namelist()
              license_names = [n for n in names if n.endswith('.dist-info/licenses/LICENSE') or n.endswith('.dist-info/LICENSE')]
              if not license_names:
                  sys.exit(f'Wheel verification failed: LICENSE file missing from dist-info. Found: {names}')
              print(f'Found wheel license: {license_names}')

              metadata_names = [n for n in names if n.endswith('.dist-info/METADATA')]
              if not metadata_names:
                  sys.exit('Wheel verification failed: METADATA file missing from dist-info')

              metadata_text = zf.read(metadata_names[0]).decode('utf-8', errors='replace')
              if 'License-Expression: Apache-2.0' not in metadata_text:
                  sys.exit('Wheel verification failed: License-Expression: Apache-2.0 not in METADATA')
              if 'License-File: LICENSE' not in metadata_text:
                  sys.exit('Wheel verification failed: License-File: LICENSE not in METADATA')
              print('Wheel METADATA verified (PEP 639 License-Expression and License-File present).')

          print(f'Inspecting sdist: {sdist_path.name}')
          with tarfile.open(sdist_path, 'r:gz') as tf:
              tar_names = tf.getnames()
              sdist_licenses = [n for n in tar_names if n.endswith('/LICENSE') or n == 'LICENSE']
              if not sdist_licenses:
                  sys.exit(f'Sdist verification failed: LICENSE missing in sdist. Found: {tar_names[:10]}')
              print(f'Found sdist license: {sdist_licenses}')

              pkg_info_names = [n for n in tar_names if n.endswith('/PKG-INFO') or n == 'PKG-INFO']
              if not pkg_info_names:
                  sys.exit('Sdist verification failed: PKG-INFO missing in sdist')

              pkg_info_f = tf.extractfile(pkg_info_names[0])
              if pkg_info_f is None:
                  sys.exit('Sdist verification failed: could not extract PKG-INFO')
              pkg_info_text = pkg_info_f.read().decode('utf-8', errors='replace')
              if 'License-Expression: Apache-2.0' not in pkg_info_text:
                  sys.exit('Sdist verification failed: License-Expression: Apache-2.0 not in PKG-INFO')
              if 'License-File: LICENSE' not in pkg_info_text:
                  sys.exit('Sdist verification failed: License-File: LICENSE not in PKG-INFO')
              print('Sdist PKG-INFO verified (PEP 639 License-Expression and License-File present).')

          print('Packaging and licensing verification successful!')
          "

      - name: Execute Clean Wheel-Install Distribution Smoke Test
        run: |
          python -m pip install --upgrade build
          python scripts/distribution_smoke_test.py

      - name: Run Unit & Adapter Test Suites
        run: |
          pytest -v tests/test_*.py

      - name: Run Security & Sandbox Configuration Suites
        run: |
          pytest -v tests/security/test_container_configuration.py tests/security/test_filesystem_isolation.py tests/security/test_worker_ipc.py tests/security/test_container_lifecycle.py

      - name: Run Live Docker Network Isolation Integration Tests
        run: |
          docker info
          pytest -v -rs tests/security/test_network_isolation.py
