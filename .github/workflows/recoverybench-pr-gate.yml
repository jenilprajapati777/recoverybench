name: RecoveryBench PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-recovery-gate:
    name: Agent Recovery Invariant Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install RecoveryBench
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[langgraph,dev]"

      - name: Verify Scenarios
        run: recoverybench validate scenarios

      - name: Pull Pinned Docker Sandbox Runtime Image
        run: docker pull python:3.11-slim@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535

      - name: Execute Full Recovery Suite
        id: eval-suite
        run: |
          recoverybench suite scenarios \
            --agent "idempotent" \
            --isolation "isolated" \
            --output-dir "pr-reports" \
            --junit

      - name: Run Live Docker Network Isolation Tests
        run: |
          pytest -v -rs tests/security/test_network_isolation.py

      - name: Upload PR Recovery Artifacts
        uses: actions/upload-artifact@v4
        if: always() && (steps.eval-suite.conclusion == 'success' || steps.eval-suite.conclusion == 'failure')
        with:
          name: pr-recovery-reports
          path: pr-reports/
          retention-days: 14
