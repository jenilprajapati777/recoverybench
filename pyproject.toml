[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "recoverybench"
version = "0.1.0"
description = "A local-first AI Agent Recovery Testing Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "RecoveryBench Contributors" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
]

[project.urls]
Homepage = "https://github.com/jenilprajapati777/recoverybench"
Repository = "https://github.com/jenilprajapati777/recoverybench"
Issues = "https://github.com/jenilprajapati777/recoverybench/issues"

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
recoverybench = "recoverybench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/recoverybench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
